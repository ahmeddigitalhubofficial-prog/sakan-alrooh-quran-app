# ==============================================================================
# Codemagic CI/CD Pipeline - سكن الروح (Sakan Al-Rooh)
# مصمم لبناء وتوقيع ورفع تطبيق iOS إلى Apple App Store & TestFlight تلقائياً
# ==============================================================================

workflows:
  ios-release:
    name: iOS Production Release & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nooralhoda.official.app
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.nooralhoda.official.app"
        APP_NAME: "سكن الروح"
    scripts:
      - name: 1. Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: 2. Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: 3. Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: 4. Build iOS IPA Release
        script: |
          # بناء حزمة الإنتاج IPA الموقعة والجاهزة لمتجر أبل مع عزل تام وتطهير من خدمات المتاجر الأخرى
          flutter build ipa --release \
            --dart-define=TARGET_STORE=apple \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - ahmed.digitalhub.official@gmail.com
        notify:
          failure: true
          success: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false # اتركه false حتى تراجع النسخة في TestFlight أولاً ثم تقدمها بيدك
