# ==============================================================================
# Codemagic CI/CD Pipeline - سكن الروح (Sakan Al-Rooh)
# مصمم لبناء وتوقيع ورفع تطبيق iOS إلى Apple App Store & TestFlight تلقائياً
# ==============================================================================

workflows:
  ios-release:
    name: iOS Production Release & TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # المجموعة التي ستحتوي على مفاتيح أبل في إعدادات Codemagic
      vars:
        BUNDLE_ID: "com.nooralhoda.official.app"
        APP_NAME: "سكن الروح"
    scripts:
      - name: 1. Set up keychain & certificates
        script: |
          keychain initialize
      - name: 2. Fetch signing files from Apple Developer Portal
        script: |
          # يقوم تلقائياً بإنشاء وجلب شهادات الإنتاج و Provisioning Profile من حساب أبل
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: 3. Add certificates to keychain
        script: |
          keychain add-certificates
      - name: 4. Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: 5. Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: 6. Install CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: 7. Build iOS IPA Release
        script: |
          # بناء حزمة الإنتاج IPA الموقعة والجاهزة لمتجر أبل مع عزل تام وتطهير من خدمات المتاجر الأخرى
          flutter build ipa --release \
            --dart-define=TARGET_STORE=apple \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - user@example.com # ضع بريدك الإلكتروني هنا لتلقي إشعار عند نجاح البناء
        notify:
          failure: true
          success: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false # اتركه false حتى تراجع النسخة في TestFlight أولاً ثم تقدمها بيدك
