name: noor_al_hoda
description: "تطبيق سكن الروح (Sakan Al-Rooh) - رفيقك الإسلامي للقرآن والأذكار ومواقيت الصلاة الفلكية والسبحة والقبلة."
publish_to: 'none'

version: 1.2.0+36

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحزم الفاخرة للخصائص الإسلامية والتقنية الحديثة
  quran: ^1.2.9                  # نصوص القرآن، الفهرس، والترجمات دون إنترنت
  adhan: ^2.0.0+1                # حساب مواقيت الصلاة الفلكية (يدعم طريقة المساحة المصرية)
  geolocator: ^14.0.2             # تحديد الموقع الجغرافي لحساب المواقيت والقبلة
  flutter_compass: ^0.8.1        # حركة البوصلة للقبلة
  shared_preferences: ^2.5.5     # حفظ الأذكار المنجزة وإحصائيات السبحة والمدينة المفضلة
  flutter_svg: ^2.3.0            # عرض الزخارف والبوصلة المتوهجة بدقة متناهية
  google_fonts: ^8.1.0           # خطوط Amiri و Cairo الفاخرة
  # Huawei Mobile Services (HMS)
  huawei_account: ^6.11.0+301

  # Native Animations & Visuals
  intl: ^0.20.2                  # التنسيق واللغة العربية والتواريخ
  just_audio: ^0.10.5             # تشغيل التلاوات الصوتية للشيخ مشاري العفاسي
  flutter_local_notifications: ^22.3.0 # لإشعارات الأذان والورد اليومي والتنبيهات
  provider: ^6.1.5+1               # لإدارة حالة السمات والمهام المخصصة
  hijri: ^3.0.1
  flutter_screenutil: ^5.9.3
  timezone: ^0.11.0
  crypto: ^3.0.6
  flutter_background_service: ^5.1.0
  flutter_launcher_icons: ^0.14.4
  home_widget: ^0.9.2
  camera: ^0.12.0+1
  share_plus: ^13.1.0
  speech_to_text: ^7.4.0
  path_provider: ^2.1.5
  audio_session: ^0.2.3
  flutter_secure_storage: 10.3.1 # مكتبة التخزين الآمن لمفاتيح الـ API والمعلومات الحساسة
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_auth: ^6.6.0
  google_sign_in: 6.3.0
  cloud_firestore: ^6.9.0
  in_app_review: ^2.0.9
  in_app_update: ^4.2.3          # التحديث التلقائي الفوري والمرن من متجر Google Play
  package_info_plus: ^10.2.1
  shorebird_code_push: 1.1.6
  url_launcher: ^6.3.1
  video_player: ^2.9.2





dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - CHANGELOG.md
    - REFERENCES.md
    - PRIVACY_POLICY.md
    - shorebird.yaml
    - assets/data/spiritual_reels.json
flutter_launcher_icons:

  android: true

  ios: false

  image_path:
    "lib/assets/images/app_icon.png"